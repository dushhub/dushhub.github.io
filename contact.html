<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dush Hub</title>
    <link rel="icon" type="image/png" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/svgs/solid/envelope.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-code"></i> Dush<span>Hub</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="software.html">Software</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="single-tool-box" style="max-width: 550px;">
            <h2>Contact <span>Me</span></h2>
            <p style="margin-bottom: 25px;">If you need a custom tool built or want to report a bug, drop me a message below.</p>
            <form action="https://formspree.io/f/mgogzkgg" method="POST" class="form-grid">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit" class="btn-main" style="width: 100%; justify-content: center;">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Dush Hub. All rights reserved.</p>
    </footer>
</body>
</html>
